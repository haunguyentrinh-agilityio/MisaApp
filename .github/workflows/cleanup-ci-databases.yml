# Safety net for e2e runs that were cancelled before their "Drop ephemeral database" step:
# removes sqldb-misaapp-ci-* databases older than two hours and orphaned ci-* firewall rules.
name: cleanup-ci-databases

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: cleanup-ci-databases

jobs:
  sweep:
    name: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NAME_SUFFIX: ${{ vars.NAME_SUFFIX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Scheduled runs use refs/heads/main, which the CI identity's gh-main subject covers.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: bash infra/scripts/ci-database.sh sweep --older-than-hours 2
