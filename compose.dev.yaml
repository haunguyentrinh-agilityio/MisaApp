# Hot-reload overlay. Usage:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
# After changing package.json / pnpm-lock.yaml, add `-V` to refresh the node_modules volume.
services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/src
      # Keep Linux build output and NuGet cache out of the Windows bind mount.
      - backend-bin:/src/src/MisaApp.Api/bin
      - backend-obj:/src/src/MisaApp.Api/obj
      - nuget-cache:/root/.nuget/packages

  frontend:
    build:
      target: dev
    environment:
      API_PROXY_TARGET: http://backend:8080
      VITE_USE_POLLING: "true"
    ports: !override
      - "${WEB_PORT:-3000}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  playwright:
    environment:
      BASE_URL: http://frontend:5173

volumes:
  backend-bin:
  backend-obj:
  nuget-cache:
