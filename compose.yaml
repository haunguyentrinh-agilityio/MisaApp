# Production-like stack: `docker compose up -d --build`
# Hot-reload dev stack:  `docker compose -f compose.yaml -f compose.dev.yaml up -d --build`
# E2E tests:             `docker compose --profile e2e run --rm playwright`
# There is no database: chats are kept only in the visitor's browser.
name: misaapp

services:
  backend:
    build:
      context: ./backend
      target: runtime
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-dev}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - "${API_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-dev}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - backend

  playwright:
    build: ./frontend/e2e
    profiles: [e2e]
    environment:
      BASE_URL: http://frontend
    ipc: host
    volumes:
      - ./frontend/e2e/playwright-report:/e2e/playwright-report
      - ./frontend/e2e/test-results:/e2e/test-results
    depends_on:
      - frontend
